dataset:
  name: 'fashion_mnist'
  data_dir: './data'
  val_split: 0.2
  normalize: true
  flatten: true

model:
  input_size: 784
  hidden_layers: [256, 128]
  output_size: 10
  activation: 'relu'
  output_activation: 'softmax'
  weight_init: 'he'

training:
  num_epochs: 50
  batch_size: 32
  learning_rate: 0.001
  optimizer: 'adam'
  loss: 'cross_entropy'

regularization:
  l2_lambda: 0.0001

optimizer_params:
  momentum: 0.9
  beta1: 0.9
  beta2: 0.999
  decay_rate: 0.9

wandb:
  project: 'neural-network-numpy'
  entity: 'makssuppras1-danmarks-tekniske-universitet-dtu/neural-network-numpy/'
  experiment_name: 'baseline'
  log_interval: 10
  save_model: true

random_seed: 42
verbose: true
save_dir: './results'

